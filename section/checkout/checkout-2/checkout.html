<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>title</title>
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Serif+TC:wght@200..900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./public/css/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./public/icomoon/style.css" />
    <link rel="stylesheet" href="./public/css/style.css" />
  </head>
  <body>
    <main>
      <div class="checkout">
        <div class="checkout-item">
          <div class="checkout-title">
            <img
              class="checkout-title__icon"
              src="./public/img/cart.svg"
              alt=""
            />
            <h2 class="checkout-title__text">訂單明細</h2>
          </div>
          <div class="checkout-content">
            <div class="checkout-order">
              <div class="checkout-order-content">
                <div class="checkout-order-item">
                  <div class="checkout-order-name">
                    <input type="checkbox" id="product-1" />
                    <label for="product-1" class="checkout-order-name__label">
                      <span class="checkout-order-name__plan"
                        >進階維護方案 <img src="./public/img/info.svg" alt=""
                      /></span>
                      <span class="checkout-order-name__intro"
                        >包月維護 | 企業級規格</span
                      >
                    </label>
                  </div>
                  <div class="checkout-order-info">
                    <p class="checkout-order-price">NT$30,000</p>
                    <button class="checkout-order-delete">
                      <svg
                        width="26"
                        height="26"
                        viewBox="0 0 26 26"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M9.67461 5.825H9.49961C9.59586 5.825 9.67461 5.74625 9.67461 5.65V5.825H16.3246V5.65C16.3246 5.74625 16.4034 5.825 16.4996 5.825H16.3246V7.4H17.8996V5.65C17.8996 4.87781 17.2718 4.25 16.4996 4.25H9.49961C8.72742 4.25 8.09961 4.87781 8.09961 5.65V7.4H9.67461V5.825ZM20.6996 7.4H5.29961C4.91242 7.4 4.59961 7.71281 4.59961 8.1V8.8C4.59961 8.89625 4.67836 8.975 4.77461 8.975H6.09586L6.63617 20.4156C6.67117 21.1616 7.28805 21.75 8.03398 21.75H17.9652C18.7134 21.75 19.328 21.1637 19.363 20.4156L19.9034 8.975H21.2246C21.3209 8.975 21.3996 8.89625 21.3996 8.8V8.1C21.3996 7.71281 21.0868 7.4 20.6996 7.4ZM17.7968 20.175H8.20242L7.67305 8.975H18.3262L17.7968 20.175Z"
                          fill="#6B6B6B"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="checkout-order-item">
                  <div class="checkout-order-name">
                    <input type="checkbox" id="product-2" />
                    <label for="product-2" class="checkout-order-name__label">
                      <span class="checkout-order-name__plan"
                        >設計/開發點數 <img src="./public/img/info.svg" alt=""
                      /></span>
                      <span class="checkout-order-name__intro"
                        >5 點 (5小時)</span
                      >
                    </label>
                  </div>
                  <div class="checkout-order-info">
                    <p class="checkout-order-price">NT$4,000</p>
                    <button class="checkout-order-delete">
                      <svg
                        width="26"
                        height="26"
                        viewBox="0 0 26 26"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M9.67461 5.825H9.49961C9.59586 5.825 9.67461 5.74625 9.67461 5.65V5.825H16.3246V5.65C16.3246 5.74625 16.4034 5.825 16.4996 5.825H16.3246V7.4H17.8996V5.65C17.8996 4.87781 17.2718 4.25 16.4996 4.25H9.49961C8.72742 4.25 8.09961 4.87781 8.09961 5.65V7.4H9.67461V5.825ZM20.6996 7.4H5.29961C4.91242 7.4 4.59961 7.71281 4.59961 8.1V8.8C4.59961 8.89625 4.67836 8.975 4.77461 8.975H6.09586L6.63617 20.4156C6.67117 21.1616 7.28805 21.75 8.03398 21.75H17.9652C18.7134 21.75 19.328 21.1637 19.363 20.4156L19.9034 8.975H21.2246C21.3209 8.975 21.3996 8.89625 21.3996 8.8V8.1C21.3996 7.71281 21.0868 7.4 20.6996 7.4ZM17.7968 20.175H8.20242L7.67305 8.975H18.3262L17.7968 20.175Z"
                          fill="#6B6B6B"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
              <div class="checkout-order-total">
                <p class="checkout-order-total__title">總計：</p>
                <p class="checkout-order-total__price">NT$34,000</p>
              </div>
            </div>
          </div>
        </div>
        <div class="checkout-item">
          <div class="checkout-title">
            <img
              class="checkout-title__icon"
              src="./public/img/cart.svg"
              alt=""
            />
            <h2 class="checkout-title__text">客戶資料</h2>
          </div>
          <div class="checkout-content">
            <div class="checkout-form">
              <div class="checkout-form-item">
                <label for="">聯絡人姓名</label>
                <input type="text" value="王小明" />
              </div>
              <div class="checkout-form-item">
                <label for="">公司名稱</label>
                <input type="text" value="幸運波浪科技有限公司" />
              </div>
              <div class="checkout-form-item">
                <label for="">聯絡電話</label>
                <input type="number" value="0912345678" />
              </div>
              <div class="checkout-form-item">
                <label for="">電子信箱</label>
                <input type="email" value="0912345678@gmial.com" />
              </div>
              <div class="checkout-form-item">
                <label for="">統一編號</label>
                <input type="text" placeholder="請輸入統一編號" />
              </div>
            </div>
          </div>
        </div>
        <a href="" class="checkout-btn">下一步：選擇付款方式</a>
      </div>

      <div class="checkout">
        <div class="checkout-title">
          <img
            class="checkout-title__icon"
            src="./public/img/card.svg"
            alt=""
          />
          <h2 class="checkout-title__text">選擇付款方式</h2>
        </div>
        <div class="checkout-content">
          <div class="checkout-payment">
            <div class="checkout-payment-item">
              <button class="checkout-payment-btn">
                <div class="checkout-payment-btn__circle"></div>
                <img
                  class="checkout-payment-btn__icon"
                  src="./public/img/card-gray.svg"
                  alt=""
                />
                <div class="checkout-payment-btn__text">
                  <h3 class="checkout-payment-btn__title">綠界科技 ECPay</h3>
                  <p class="checkout-payment-btn__intro">信用卡 (支援分期)</p>
                </div>
              </button>
              <div class="checkout-payment-content credit-card">
                <p>點擊「確認付款」後將跳轉至綠界加密頁面。</p>
              </div>
            </div>
            <div class="checkout-payment-item">
              <button class="checkout-payment-btn">
                <div class="checkout-payment-btn__circle"></div>
                <img
                  class="checkout-payment-btn__icon"
                  src="./public/img/bank.svg"
                  alt=""
                />
                <div class="checkout-payment-btn__text">
                  <h3 class="checkout-payment-btn__title">銀行轉帳 / ATM</h3>
                  <p class="checkout-payment-btn__intro">匯款後需回報末五碼</p>
                </div>
              </button>
              <div class="checkout-payment-content transfer">
                <h4 class="transfer-title">匯款資訊 (中國信託 822)</h4>
                <p class="transfer-detail">
                  分行：中港分行<br />
                  戶名：幸運波浪科技有限公司<br />
                  帳號：1234-5678-9012
                </p>
                <div class="transfer-input">
                  <label for="">請輸入帳號末五碼：</label>
                  <input type="number" placeholder="例如：12345" />
                </div>
                <p class="transfer-remind">
                  匯款後請來信：<a href="mailto:info@luckywave.com.tw"
                    >info@luckywave.com.tw</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
        <a href="" class="checkout-btn">確認付款 NT$34,000</a>
        <a href="" class="checkout-back">回上一步</a>
      </div>

      <div class="checkout">
        <div class="checkout-state">
          <img class="checkout-state__icon" src="./public/img/check-circle.svg" alt="">
          <h2 class="checkout-state__title">訂購成功！</h2>
          <p class="checkout-state__text">感謝您的信任，我們將盡快為您服務。</p>
          <p class="checkout-state__order">訂單編號：LW-20231122-888</p>
        <a href="" class="checkout-btn">回到首頁</a>
        </div>
      </div>

    </main>

    <script src="./public/js/jquery/jquery.min.js"></script>
    <script src="./public/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
      $(".checkout-payment-btn").click(function() {
        $(this).addClass("active").parents(".checkout-payment-item").siblings(".checkout-payment-item").find(".checkout-payment-btn").removeClass("active");
        $(this).parents(".checkout-payment-item").find(".checkout-payment-content").slideDown(300);
        $(this).parents(".checkout-payment-item").siblings(".checkout-payment-item").find(".checkout-payment-content").slideUp(300);
      })
    </script>
  </body>
</html>
