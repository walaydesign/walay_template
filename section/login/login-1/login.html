<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>title</title>
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Serif+TC:wght@200..900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./public/css/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./public/css/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./public/css/aos/aos.css" />
    <link rel="stylesheet" href="./public/icomoon/style.css" />
    <link rel="stylesheet" href="./public/css/style.css" />
    <link rel="stylesheet" href="./public/css/login-1.css" />
  </head>
  <body>
    <main>
      <div class="login">
        <div class="row">
          <div class="col-md-6">
            <div class="login_pic">
              <img src="./public/img/pic.png" alt="" />
            </div>
          </div>
          <div class="col-md-6">
            <form class="login_form">
              <div class="login_form_wrap">
                <div class="login_form_head">
                  <h1 class="login_form_title">會員登入</h1>
                  <a href="" class="login_form_link">
                    <span class="login_form_link_text">業者登入</span>
                    <span class="icon-arrow-right login_form_link_icon"></span>
                  </a>
                </div>
                <div class="login_form_main">
                  <div class="input-item">
                    <label for="">往生者姓名</label>
                    <input type="text" />
                  </div>
                  <div class="input-item">
                    <label for="">手機號碼</label>
                    <input type="number" />
                  </div>
                </div>
                <div class="login_form_footer">
                  <a href="" class="login_form_forget">忘記密碼</a>
                  <button class="btn btn-fill login_form_btn">
                    <span class="btn-text">登入</span>
                    <span class="btn-icon icon-arrow-right"></span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="./public/js/jquery/jquery.min.js"></script>
    <script src="./public/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="./public/js/swiper/swiper-bundle.min.js"></script>
    <script src="./public/js/aos/aos.js"></script>
    <script src="./public/js/jquery-ui/jquery-ui.js"></script>
    <script src="./public/js/common.js"></script>
  </body>
</html>
