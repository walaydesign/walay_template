<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Noto+Sans+TC:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./public/css/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./public/icomoon/style.css" />
    <link rel="stylesheet" href="./public/css/style.css" />
  </head>
  <body>
    <div class="cards">
      <div class="container">
        <div class="title">專為電力監控設計</div>
        <div class="row">
          <div class="col-lg-4">
            <div class="cards-item">
              <div class="cards-item__icon">
                <span class="icon-structure"></span>
              </div>
              <div class="cards-item__text">
                <h3 class="cards-item__title">大規模監控架構</h3>
                <p class="cards-item__description">單一系統即可輕鬆監控超過 1000 個以上的智慧電子裝置 (IEDs) 並支援自定義視圖，提供全面且零死角的系統掌握度。</p>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="cards-item">
              <div class="cards-item__icon">
                <span class="icon-wave"></span>
              </div>
              <div class="cards-item__text">
                <h3 class="cards-item__title">波形紀錄自動化 (eRMT)</h3>
                <p class="cards-item__description">系統能自動擷取並歸檔錄波Oscillography，同時完整儲存事件紀錄、測量數據與控制設定，以便工程師進行後續深度分析。</p>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="cards-item">
              <div class="cards-item__icon">
                <span class="icon-plugin"></span>
              </div>
              <div class="cards-item__text">
                <h3 class="cards-item__title">強大的電驛整合能力</h3>
                <p class="cards-item__description">支援將第三方電驛無縫整合，符合IEC 61850、DNP 3.0、Modbus、OPC UA等通訊協定，通過台電互操作性測試，大幅增強監控的廣度與系統的設備相容性，不受單一品牌限制。</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./public/js/jquery/jquery.min.js"></script>
    <script src="./public/js/bootstrap/bootstrap.bundle.min.js"></script>
  </body>
</html>
