<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>title</title>
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Serif+TC:wght@200..900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./public/css/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./public/icomoon/style.css" />
    <link rel="stylesheet" href="./public/css/style.css" />
  </head>
  <body>
    <main>
      <div class="step">
        <div class="container">
          <div class="step_item">
              <p class="step_num">STEP.1</p>
            <span class="step_icon icon-people-plus"></span>
            <p class="step_text">
              註冊、登入<br />
              成為會員
            </p>
          </div>
          <div class="step_item">
              <p class="step_num">STEP.2</p>
            <span class="step_icon icon-cart-2"></span>
            <p class="step_text">
              選擇喜愛的商品<br>並加入購物車
            </p>
          </div>
          <div class="step_item">
              <p class="step_num">STEP.3</p>
            <span class="step_icon icon-clipboard"></span>
            <p class="step_text">
              確認<br>訂單內容
            </p>
          </div>
          <div class="step_item">
              <p class="step_num">STEP.4</p>
            <span class="step_icon icon-delivery"></span>
            <p class="step_text">
              確認<br>訂單內容
            </p>
          </div>
          <div class="step_item">
              <p class="step_num">STEP.5</p>
            <span class="step_icon icon-mail"></span>
            <p class="step_text">
              確認<br>訂單內容
            </p>
          </div>
          <div class="step_item">
              <p class="step_num">STEP.6</p>
            <span class="step_icon icon-order"></span>
            <p class="step_text">
              訂單成立
            </p>
          </div>
          <div class="step_item">
              <p class="step_num">STEP.7</p>
            <span class="step_icon icon-parcel"></span>
            <p class="step_text">
              等待收貨
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="./public/js/jquery/jquery.min.js"></script>
    <script src="./public/js/bootstrap/bootstrap.bundle.min.js"></script>
  </body>
</html>
