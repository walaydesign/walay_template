<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>title</title>
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <meta property="og:image" content="./public/img/share.jpg" />
    <meta property="og:url" content="./public/img/share.jpg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Noto+Sans+TC:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./public/css/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./public/icomoon/style.css" />
    <link rel="stylesheet" href="./public/css/style.css" />
  </head>
  <body>
    <main>
      <div class="text-iconCards">
        <div class="container">
          <div class="row">
            <div class="col-lg-6">
              <img
                class="text-iconCards-img"
                src="./public/img/painpoint.png"
              />
            </div>
            <div class="col-lg-6">
              <div class="text-iconCards-content">
                <div class="text-iconCards-text-wrapper">
                  <h2 class="title">
                    為什麼<br class="d-lg-none" />以前 AI 創作很痛苦？
                  </h2>
                  <p class="description">
                    創意的實現應該是純粹的，<br
                      class="d-lg-none"
                    />而不該被繁瑣的工具與高昂的成本所阻礙。
                  </p>
                </div>
                <div class="text-iconCards-wrapper">
                  <div class="card-icon">
                    <div class="card-icon-icon">
                      <span class="icon-transform"></span>
                    </div>
                    <div class="card-icon-text">
                      <h3 class="card-icon-title">工具切換太疲憊</h3>
                      <div class="card-icon-description">
                        為了生圖去A網站，做影片去B網站，反覆跳轉浪費大量時間。
                      </div>
                    </div>
                  </div>
                  <div class="card-icon">
                    <div class="card-icon-icon">
                      <span class="icon-signature"></span>
                    </div>
                    <div class="card-icon-text">
                      <h3 class="card-icon-title">訂閱帳單接不完</h3>
                      <div class="card-icon-description">
                        每個AI工具都要付月費，加總起來是一筆驚人的固定開銷。
                      </div>
                    </div>
                  </div>
                  <div class="card-icon">
                    <div class="card-icon-icon">
                      <span class="icon-layout"></span>
                    </div>
                    <div class="card-icon-text">
                      <h3 class="card-icon-title">操作介面太複雜</h3>
                      <div class="card-icon-description">
                        全英文介面、各種艱深參數，光是學習如何使用就已經筋疲力盡。
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./public/js/jquery/jquery.min.js"></script>
    <script src="./public/js/bootstrap/bootstrap.bundle.min.js"></script>
  </body>
</html>
